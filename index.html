<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Document</title>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">
        Student Record Management
    </h1>

    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md mb-8">

        <div class="flex flex-col gap-2 mb-4">
            <label for="student_id" class="font-medium">Student ID</label>
            <input id="student_id" type="text" placeholder="Enter ID"
                class="border border-gray-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div class="flex flex-col gap-2 mb-4">
            <label for="student_name" class="font-medium">Name</label>
            <input id="student_name" type="text" placeholder="Enter Name"
                class="border border-gray-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div class="flex flex-col gap-2 mb-5">
            <label for="student_course" class="font-medium">Course</label>
            <input id="student_course" type="text" placeholder="Enter Course"
                class="border border-gray-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <button onclick="addStudent()"
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg w-full cursor-pointer">
            Add Student
        </button>

    </div>

    <div class="max-w-4xl mx-auto bg-white p-5 rounded-xl shadow-md overflow-x-auto">

        <table class="w-full text-left border-collapse">

            <thead>
                <tr>
                    <th class="p-3 border">Student ID</th>
                    <th class="p-3 border">Student Name</th>
                    <th class="p-3 border">Course</th>
                    <th class="p-3 border">Actions</th>
                </tr>
            </thead>

            <tbody id="result" class="divide-y divide-gray-200">
            </tbody>

        </table>

    </div>

</body><script src="script.js"></script>
</html>
